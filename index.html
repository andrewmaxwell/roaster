<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kaleido</title>
<link rel="stylesheet" href="ui/vendor/uPlot.min.css" />
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --button: #ecebe6;
    --button-hover: #e1e0d9;
    --primary: #2a78d6;
    --primary-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme='light'])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.1);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --button: #2c2c2a;
      --button-hover: #383835;
      --primary: #3987e5;
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.1);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --button: #2c2c2a;
    --button-hover: #383835;
    --primary: #3987e5;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--page);
    color: var(--text-primary);
    font:
      15px system-ui,
      -apple-system,
      'Segoe UI',
      sans-serif;
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  button {
    border: 1px solid var(--border);
    background: var(--button);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: var(--button-hover);
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  button.primary {
    background: var(--primary);
    color: var(--primary-ink);
    border-color: transparent;
  }
  button.big {
    font-size: 20px;
    font-weight: 600;
    padding: 16px;
    width: 100%;
  }
  input,
  select {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 8px;
  }
  input[type='number'] {
    width: 6em;
  }

  /* top bar: the numbers you glance at */
  #bar {
    display: flex;
    align-items: stretch;
    gap: 24px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .readout {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .readout .label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .readout .value {
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .readout.hero .value {
    font-size: 44px;
  }
  .swatch {
    display: inline-block;
    width: 10px;
    height: 3px;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 5px;
  }
  #phase {
    text-align: right;
  }
  #phase .value {
    font-size: 22px;
  }
  #stop {
    align-self: center;
    margin-left: auto;
    font-size: 18px;
    font-weight: 700;
    padding: 10px 22px;
    background: var(--critical);
    color: #fff;
    border-color: transparent;
  }
  #stop.confirm {
    animation: pulse 0.6s infinite;
  }
  /* nothing to stop: the machine has confirmed the heater is off */
  #stop:disabled {
    background: var(--button);
    color: var(--text-muted);
    border-color: var(--border);
    opacity: 1;
  }
  /* a second click is needed: outline the button and pulse it */
  #side button.confirm {
    outline: 2px solid var(--critical);
    outline-offset: 1px;
    animation: pulse 0.6s infinite;
  }
  /* readings that aren't live (server or roaster gone) fade out */
  #bar.stale .readout:not(#phase) .value {
    opacity: 0.3;
  }
  #conn {
    font-size: 13px;
    color: var(--text-secondary);
  }
  #conn.down {
    color: var(--critical);
    font-weight: 600;
  }

  /* the drop alarm takes the whole width */
  #alarm {
    display: none;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: var(--critical);
    color: #fff;
    font-size: 26px;
    font-weight: 700;
  }
  #alarm.on {
    display: flex;
    animation: pulse 1s infinite;
  }
  #alarm button {
    margin-left: auto;
    font-size: 18px;
    background: #fff;
    color: #000;
  }
  @keyframes pulse {
    50% {
      filter: brightness(1.25);
    }
  }
  #offline {
    display: none;
    padding: 10px 16px;
    background: var(--critical);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  #offline.on {
    display: block;
  }
  #offline code {
    font-weight: 400;
    background: rgba(0, 0, 0, 0.25);
    padding: 1px 6px;
    border-radius: 4px;
  }
  #hint {
    display: none;
    padding: 10px 16px;
    background: var(--warning);
    color: #000;
    font-size: 18px;
    font-weight: 600;
  }
  #hint.on {
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #charts {
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: 8px 8px 0 4px;
  }
  #charts .u-legend {
    font-size: 12px;
    margin: 0 0 2px;
  }
  #side {
    width: 360px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 12px 14px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  section h2.batch {
    font-size: 16px;
    color: var(--text-primary);
    text-transform: none;
    letter-spacing: 0;
  }
  section h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 6px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .note {
    color: var(--text-secondary);
    font-size: 14px;
  }
  .ready {
    font-size: 20px;
    font-weight: 700;
    color: var(--good);
  }
  table.steps {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  table.steps td {
    padding: 4px 2px;
    border-bottom: 1px solid var(--border);
  }
  table.steps tr.done {
    color: var(--text-muted);
  }
  table.steps tr.next {
    font-weight: 700;
  }
  .control {
    display: grid;
    grid-template-columns: 4.5em auto 1fr;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .control .pct {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .tag {
    font-size: 12px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--warning);
    color: #000;
  }
  .alert {
    display: flex;
    gap: 6px;
    font-size: 14px;
  }
  .alert .icon {
    font-weight: 700;
    white-space: nowrap;
  }
  .alert .when {
    margin-left: auto;
    color: var(--text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .alert.urgent .icon {
    color: var(--critical);
  }
  .alert.warn .icon {
    color: var(--warning);
  }
  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--critical);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    display: none;
  }
  #toast.on {
    display: block;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }
  #start button {
    font-size: 24px;
    padding: 20px 36px;
  }
</style>

<div id="bar">
  <div class="readout hero">
    <span class="label">Roast time</span>
    <span class="value" id="timer">–</span>
  </div>
  <div class="readout hero">
    <span class="label"
      ><i class="swatch" style="background: var(--series-1)"></i>BT</span
    >
    <span class="value" id="bt">–</span>
  </div>
  <div class="readout">
    <span class="label">Rate of rise</span>
    <span class="value" id="ror">–</span>
  </div>
  <div class="readout">
    <span class="label"
      ><i class="swatch" style="background: var(--series-2)"></i>ET</span
    >
    <span class="value" id="et">–</span>
  </div>
  <div class="readout">
    <span class="label"
      ><i class="swatch" style="background: var(--series-3)"></i>Burner</span
    >
    <span class="value" id="burner">–</span>
  </div>
  <div class="readout">
    <span class="label"
      ><i class="swatch" style="background: var(--series-4)"></i>Air</span
    >
    <span class="value" id="air">–</span>
  </div>
  <button id="stop" title="Heater off now. Air and drum keep running.">
    STOP
  </button>
  <div class="readout" id="phase">
    <span class="label" id="conn">connecting…</span>
    <span class="value" id="phaseText">–</span>
  </div>
</div>
<div id="alarm">
  <span>⚠ DROP NOW: open the door</span>
  <button id="beansOut">Beans are out</button>
</div>
<div id="offline">
  Lost the app server. These numbers aren't live. If it crashed, the guardian
  turned the heater off. Start it again with
  <code>node server/main.js</code> and the session picks up where it
  was.
</div>
<div id="hint"></div>
<main>
  <div id="charts"></div>
  <div id="side"></div>
</main>
<div id="toast"></div>
<div id="start"><button class="primary">Start (turns on sound)</button></div>
<script type="module" src="main.js"></script>
